[env:paperdiy]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
  pre:tools/pio_sd_uninit.py
  post:tools/pio_usb_dcd.py
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/m5stack/M5GFX.git#347a23274081a105cb9fc0fc3bbf0e15c78e79c3
  https://github.com/m5stack/M5Unified.git#e125e73f28b6b83e621e48df432af426bb2ff935
monitor_speed = 115200
