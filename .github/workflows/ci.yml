name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev
      - run: pip install -r requirements-dev.txt
      - run: python tests/public_source.py
      - run: python tools/check_public_source.py --index .
      - name: Cache pinned test fonts without replacing source headers
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import build_fonts; build_fonts.load_font_data()"
          python tools/build_math_fonts.py --output .cache/math-test.h
      - run: pio run
      - run: cmake -S . -B build -DSANITIZE=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: git diff --exit-code
